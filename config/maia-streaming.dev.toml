# ==============================================================================
# Maia Streaming Server - Local Development Configuration
# ==============================================================================

[server]
bind = "127.0.0.1"
port = 8090
worker_threads = 4
max_connections = 4096

[storage]
type = "filesystem"
root = "/tmp/maia-streaming-media"

[vod]
max_range_bytes = 67108864
send_chunk_bytes = 1048576

[auth]
issuer = "maia-platform"
audience = "maia-streaming"
secret_key = "maia-dev-secret-key-do-not-use-in-production"
require_tokens = false

[processing]
max_parallel_jobs = 2
ffmpeg = "/usr/bin/ffmpeg"
ffprobe = "/usr/bin/ffprobe"

[metrics]
enabled = true
path = "/metrics"

[webrtc]
enabled = true
udp_port_start = 20000
udp_port_end = 20100
