[server]
bind = "127.0.0.1"
port = 8090
worker_threads = 4
max_connections = 4096

[storage]
type = "filesystem"
root = "/srv/maia/media"

[vod]
max_range_bytes = 67108864
send_chunk_bytes = 1048576

[auth]
issuer = "maia-platform"
audience = "maia-streaming"
# Production secrets/keys must not be stored in this file.

[processing]
max_parallel_jobs = 2
ffmpeg = "/usr/bin/ffmpeg"
ffprobe = "/usr/bin/ffprobe"

[metrics]
enabled = true
path = "/metrics"

[webrtc]
enabled = false
# Filled during Maia Meet SFU extraction. Preserve the proven deployment values.
